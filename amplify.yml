version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify console env vars exist only at build time. Write the
        # server-side ones into .env.production so Next.js API routes
        # (SSR compute) can read them at runtime.
        - env | grep -E '^GEMINI_' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
